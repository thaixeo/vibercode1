<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ngôi sao 5 cánh</title>
<style>
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #b71c1c; font-family: system-ui, sans-serif; color: #fff;
  }
  svg { width: min(80vw, 420px); height: auto; }
  .canh {
    fill: #ffd600; fill-opacity: 0;
    stroke: #ffd600; stroke-width: 2; stroke-linejoin: round;
    stroke-dasharray: 600; stroke-dashoffset: 600;
    animation: ve 0.6s ease forwards, to 0.5s ease forwards;
  }
  .tam { fill: #ffd600; opacity: 0; animation: hien 0.5s ease forwards; }
  @keyframes ve   { to { stroke-dashoffset: 0; } }
  @keyframes to   { to { fill-opacity: 1; } }
  @keyframes hien { to { opacity: 1; } }
  button {
    margin-top: 24px; padding: 10px 24px; font-size: 16px;
    border: 2px solid #ffd600; border-radius: 8px;
    background: transparent; color: #ffd600; cursor: pointer;
  }
  button:hover { background: #ffd600; color: #b71c1c; }
</style>
</head>
<body>
  <svg id="sao" viewBox="0 0 400 400"></svg>
  <button id="veLai">Vẽ lại</button>

<script>
  const svg = document.getElementById('sao');
  const NS = 'http://www.w3.org/2000/svg';
  const cx = 200, cy = 210, R = 180, r = R * 0.382;
  const THOI_GIAN_MOI_CANH = 0.9; // giây giữa các cánh

  // Tính toạ độ: đỉnh ngoài (mũi cánh) và đỉnh trong (chân cánh)
  const diem = (ban_kinh, goc) => {
    const rad = (goc - 90) * Math.PI / 180;
    return [cx + ban_kinh * Math.cos(rad), cy + ban_kinh * Math.sin(rad)];
  };
  const ngoai = [...Array(5)].map((_, k) => diem(R, 72 * k));
  const trong = [...Array(5)].map((_, k) => diem(r, 72 * k + 36));
  const chuoi = pts => pts.map(p => p.join(',')).join(' ');

  function ve() {
    svg.innerHTML = '';

    // Phần ngũ giác ở giữa hiện ra trước
    const tam = document.createElementNS(NS, 'polygon');
    tam.setAttribute('points', chuoi(trong));
    tam.setAttribute('class', 'tam');
    svg.appendChild(tam);

    // Từng cánh: tam giác nối chân trái - mũi - chân phải
    for (let k = 0; k < 5; k++) {
      const canh = document.createElementNS(NS, 'polygon');
      canh.setAttribute('points', chuoi([trong[(k + 4) % 5], ngoai[k], trong[k]]));
      canh.setAttribute('class', 'canh');
      const tre = 0.5 + k * THOI_GIAN_MOI_CANH;
      canh.style.animationDelay = `${tre}s, ${tre + 0.5}s`;
      svg.appendChild(canh);
    }
  }

  document.getElementById('veLai').onclick = ve;
  ve();
</script>
</body>
</html>
